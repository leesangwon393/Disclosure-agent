[project]
name = "disclosure-rag"
version = "0.1.0"
description = "금융공시 특화 Agentic RAG 시스템"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.3",
  "pydantic>=2.9",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "kiwipiepy>=0.20",
  "bm25s>=0.2.6",
  "qdrant-client>=1.12",
  "sentence-transformers>=3.3",
  "FlagEmbedding>=1.3",
  "semantic-router>=0.1.0",
  "rapidfuzz>=3.10",
  "pytest>=8.3",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 느린 테스트 (모델 다운로드/로딩 등)"]
